helpers:
    ckr: &common-kibana-rules
        access: rw
        hide_apps: ['Enterprise Search|Overview', 'Observability']
        index: '.kibana_@{acl:current_group}'

    ag: &all-groups
        groups:
            - id: admins_group
              name: administrators
            - id: infosec_group
              name: infosec
            - id: template_group
              name: template

readonlyrest:
    response_if_req_forbidden: You shall not pass!
    audit:
        enabled: true
        outputs:
            - type: index
              index_template: "'readonlyrest_audit_'yyyy-MM-dd"

    access_control_rules:
        - name: 'Kibana service account - user/pass'
          verbosity: error
          auth_key: kibana:kibana

        - name: JWT_AUTH
          jwt_auth:
              name: 'jwt1'
              groups_any_of: ['administrators', 'infosec', 'template']
          kibana:
              access: admin

        - name: USER_DEFAULT
          auth_key: user2:dev
          verbosity: error
          indices: ['kibana_sample_data_*']
          kibana:
              access: rw
              index: '.default_index'

        - name: PERSONAL_GRP
          groups: [Personal]
          kibana:
              <<: *common-kibana-rules
              index: '.kibana_@{user}'

        - name: ADMIN_GRP
          groups: [admins_group]
          kibana:
              <<: *common-kibana-rules
              access: admin
              hide_apps: ['Enterprise Search|Overview', 'Management']
              metadata:
                  alert_message: 'Dear @{acl:user}'
        - name: infosec
          groups: [infosec_group]
          kibana:
              <<: *common-kibana-rules
              access: admin
              hide_apps: ['Enterprise Search|Overview', 'Observability', 'Management']

        - name: Template Tenancy
          groups: [template_group]
          kibana:
              <<: *common-kibana-rules

        - name: 'ReadonlyREST Enterprise instance #1'
          kibana_index: '.kibana_external_auth'
          ror_kbn_auth:
              name: 'kbn1'

    users:
        - username: admin
          auth_key: admin:dev
          <<: *all-groups

        - username: user1
          auth_key: user1:dev
          <<: *all-groups

        - username: '*'
          jwt_auth:
              name: 'jwt1'
          groups:
              - local_group:
                    id: admins_group
                    name: administrators
                external_group_ids: ['administrators']
              - local_group:
                    id: infosec_group
                    name: infosec
                external_group_ids: ['infosec']
              - local_group:
                    id: template_group
                    name: template
                external_group_ids: ['template']

    jwt:
        - name: jwt1
          signature_key: 'a-string-secret-at-least-256-bits-long'
          group_ids_claim: group
          user_claim: sub
          header_name: Authorization

    ror_kbn:
        - name: kbn1
          signature_key: ''

    impersonation:
        - impersonator: admin
          users: ['*']
          auth_key: admin:dev

readonlyrest_kbn:
    cookiePass: '12312313123213123213123adadasdasdasd'
    logLevel: 'trace'
    logPrettyPrintEnabled: true
    whitelistedPaths: [".*/api/status$"]
    clearSessionOnEvents: [login, tenancyHop]
    sessions_probe_interval_seconds: 60
    store_sessions_in_index: true
    login_title: Loaded from index!
    login_subtitle: 'PRO/Enterprise: You should see a red border, a tiny unicorn logo, a two column page, and this text. You should see none of these customisation when testing ROR Free.'
    login_custom_logo: 'https://i.imgur.com/MdRBUfV.gif'
    login_html_head_inject: '<style> body { border: 3px solid red; }</style>'
