events { }

http {
  # `kbn-ror` resolves to both Kibana replicas, so this one line becomes two round-robin peers.
  #
  # max_fails=0 turns ejection off. The default, max_fails=1 fail_timeout=10s, cannot work with two
  # peers and a suite that restarts Kibana: a settings change makes BOTH replicas answer 503 for a
  # few seconds, one 503 each ejects both, and nginx then has no peer left and answers 502 — to
  # every request, including for ten seconds after the replicas are healthy again.
  #
  # Measured on a two-replica reproduction, both peers answering 503 and then recovering:
  #
  #   max_fails=1 fail_timeout=10s   502 "no live upstreams", first 200 at 10.49s after recovery
  #   max_fails=0                    503 passed through,      first 200 at  0.01s after recovery
  #
  # With ejection off, a peer that cannot take a request costs that request one failover and
  # nothing more, and a peer that recovers is used again immediately.
  upstream kbn-ror {
    server kbn-ror:5601 max_fails=0;
  }
  
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/kibana/kibana.crt;
    ssl_certificate_key /etc/nginx/kibana/kibana.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass https://kbn-ror;  
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_verify off;  # Disable SSL verification for internal requests (only if Kibana uses self-signed certs)

      # A Kibana replica that is restarting drops the packets instead of refusing them, so a
      # connection to it hangs rather than failing. Without a connect timeout nginx waits the
      # default 60 seconds, which is longer than every Cypress timeout, so the browser gives up
      # first and the failure never reaches nginx to be counted against the peer. Two seconds is
      # far above a healthy connect on the container network and far below the 10s Cypress spends
      # on cy.wait().
      proxy_connect_timeout 2s;

      # Send the request to the other replica when this one cannot take it. http_503 is here
      # because a Kibana that is listening but still starting answers 503, which is not an error
      # to nginx by default. Two tries, because there are two replicas.
      #
      # Keeping http_503 matters: with one replica restarting and the other healthy, retrying the
      # 503 elsewhere turned 12 failures in 24 requests into 0 on the same reproduction.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 5s;
    }
  }
}