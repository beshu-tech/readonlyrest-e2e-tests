apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: eck-ror
spec:
  version: ${KBN_VERSION}
  image: ${ROR_KBN_REPO}:${KBN_VERSION}-ror-${ROR_KBN_VERSION}
  count: 1
  elasticsearchRef:
    name: eck-ror
  config:
    # csp needs to be disabled to let cypress e2e tests works
    csp.strict: false
    csp.warnLegacyBrowsers: false
    ${APM_PACKAGES}
    # KBN ROR settings
    readonlyrest_kbn:
      cookiePass: '12312313123213123213123adadasdasdasd'
      logLevel: trace
      store_sessions_in_index: true
    ${ELATICSEARCH_USER}
    ${ELATICSEARCH_PASSWORD}
              
  podTemplate:
    spec:
      containers:
        - name: kibana
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: ROR_ACTIVATION_KEY
              value: "${ROR_ACTIVATION_KEY}"
            - name: I_UNDERSTAND_AND_ACCEPT_KBN_PATCHING
              value: "yes"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          # The default readiness probe (timeoutSeconds: 5, failureThreshold: 3) flips the pod
          # NotReady under normal kind/CI CPU contention, which pulls it out of the Service's
          # endpoints and turns any in-flight request into a bare TCP reset instead of a slow-but-
          # valid response - the ECONNRESET flakiness seen in e2e runs traces back to this, not to
          # the e2e HTTP client. Widening the tolerance keeps flaky-but-alive Kibana in rotation.
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
            successThreshold: 1
          # No CPU limit is set deliberately (avoids throttling), but an explicit request gives
          # Kibana a fairer scheduling share against ES/APM/kind's own control-plane pods sharing
          # the same Docker Desktop CPU budget.
          resources:
            requests:
              cpu: '500m'
              memory: '2Gi'
            limits:
              memory: '2Gi'