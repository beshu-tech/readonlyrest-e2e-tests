apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: eck-ror
spec:
  version: ${KBN_VERSION}
  # start.sh builds this name, pulls it on the host and loads it into the Kind nodes.
  image: ${ROR_KBN_IMAGE}
  count: 1
  elasticsearchRef:
    name: eck-ror
  config:
    # csp needs to be disabled to let cypress e2e tests works
    csp.strict: false
    csp.warnLegacyBrowsers: false
    ${APM_PACKAGES}
    # KBN ROR settings
    readonlyrest_kbn:
      cookiePass: '12312313123213123213123adadasdasdasd'
      logLevel: trace
      store_sessions_in_index: true
    ${ELATICSEARCH_USER}
    ${ELATICSEARCH_PASSWORD}
              
  podTemplate:
    spec:
      containers:
        - name: kibana
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: ROR_ACTIVATION_KEY
              value: "${ROR_ACTIVATION_KEY}"
            - name: I_UNDERSTAND_AND_ACCEPT_KBN_PATCHING
              value: "yes"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"