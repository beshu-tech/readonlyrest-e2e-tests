apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: eck-ror
spec:
  version: ${KBN_VERSION}
  image: ${ROR_KBN_REPO}:${KBN_VERSION}-ror-${ROR_KBN_VERSION}
  count: 1
  elasticsearchRef:
    name: eck-ror
  config:
    # csp needs to be disabled to let cypress e2e tests works
    csp.strict: false
    csp.warnLegacyBrowsers: false
    ${APM_PACKAGES}
    # KBN ROR settings
    readonlyrest_kbn:
      cookiePass: '12312313123213123213123adadasdasdasd'
      logLevel: trace
      store_sessions_in_index: true
    ${ELATICSEARCH_USER}
    ${ELATICSEARCH_PASSWORD}
              
  podTemplate:
    spec:
      containers:
        - name: kibana
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: ROR_ACTIVATION_KEY
              value: "${ROR_ACTIVATION_KEY}"
            - name: I_UNDERSTAND_AND_ACCEPT_KBN_PATCHING
              value: "yes"
            # Kibana 9.4.6 exhausts a 768 MB heap. The docker environment gives it 1280 MB too.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1280"
          # The default limit is 1 GiB on ECK 2.x and 2 GiB on ECK 3.5. The pod peaked at 1.06 GiB with a
          # 768 MB heap. 2 GiB holds the 1280 MB heap and the rest of the node process, on each ECK.
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 2Gi
