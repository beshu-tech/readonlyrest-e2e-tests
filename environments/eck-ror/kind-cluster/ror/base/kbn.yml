apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: eck-ror
spec:
  version: ${KBN_VERSION}
  image: ${ROR_KBN_REPO}:${KBN_VERSION}-ror-${ROR_KBN_VERSION}
  count: 1
  elasticsearchRef:
    name: eck-ror
  config:
    # csp needs to be disabled to let cypress e2e tests works
    csp.strict: false
    csp.warnLegacyBrowsers: false
    ${APM_PACKAGES}
    # KBN ROR settings
    readonlyrest_kbn:
      cookiePass: '12312313123213123213123adadasdasdasd'
      logLevel: trace
      store_sessions_in_index: true
    ${ELATICSEARCH_USER}
    ${ELATICSEARCH_PASSWORD}
              
  podTemplate:
    spec:
      containers:
        - name: kibana
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: ROR_ACTIVATION_KEY
              value: "${ROR_ACTIVATION_KEY}"
            - name: I_UNDERSTAND_AND_ACCEPT_KBN_PATCHING
              value: "yes"
            - name: NODE_OPTIONS
              # 768 was tight enough on its own to be a plausible contributor to the readiness
              # flapping below (GC pressure blocking the event loop long enough to miss a probe).
              # Raised in step with the memory limit increase below.
              value: "--max-old-space-size=1536"
          # The default readiness probe (timeoutSeconds: 5, failureThreshold: 3) flips the pod
          # NotReady under normal kind/CI CPU contention. `publishNotReadyAddresses` on the
          # kbn-np Service (see kbn-np.yml) now stops that flapping from turning into a hard
          # ECONNRESET at the network level, but the probe's own timing was still inverted -
          # timeoutSeconds must be <= periodSeconds or a slow-but-alive response can be judged
          # a failure before the next check even starts.
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          # No CPU limit is set deliberately (avoids throttling), but an explicit request gives
          # Kibana a fairer scheduling share against ES/APM/kind's own control-plane pods sharing
          # the same Docker Desktop CPU budget. Memory limit raised alongside NODE_OPTIONS above -
          # 2Gi left barely any headroom over the 768Mi heap cap for Kibana's own process memory.
          resources:
            requests:
              cpu: '500m'
              memory: '2Gi'
            limits:
              memory: '3Gi'