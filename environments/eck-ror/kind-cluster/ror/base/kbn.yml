apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: eck-ror
spec:
  version: ${KBN_VERSION}
  image: ${ROR_KBN_REPO}:${KBN_VERSION}-ror-${ROR_KBN_VERSION}
  count: 1
  elasticsearchRef:
    name: eck-ror
  config:
    # csp needs to be disabled to let cypress e2e tests works
    csp.strict: false
    csp.warnLegacyBrowsers: false
    ${APM_PACKAGES}
    # KBN ROR settings
    readonlyrest_kbn:
      cookiePass: '12312313123213123213123adadasdasdasd'
      logLevel: trace
      store_sessions_in_index: true
    ${ELATICSEARCH_USER}
    ${ELATICSEARCH_PASSWORD}
              
  podTemplate:
    spec:
      containers:
        - name: kibana
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: ROR_ACTIVATION_KEY
              value: "${ROR_ACTIVATION_KEY}"
            - name: I_UNDERSTAND_AND_ACCEPT_KBN_PATCHING
              value: "yes"
            - name: NODE_OPTIONS
              # A smaller heap causes GC pauses long enough to fail the readiness probe.
              value: "--max-old-space-size=1536"
          # The default probe (timeoutSeconds: 5, failureThreshold: 3) fails under CI CPU load.
          # timeoutSeconds must not be more than periodSeconds.
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          # No CPU limit, to prevent throttling. The CPU request gives Kibana a share against the
          # other pods on the kind node. The memory limit leaves space above the heap cap.
          resources:
            requests:
              cpu: '500m'
              memory: '2Gi'
            limits:
              memory: '3Gi'