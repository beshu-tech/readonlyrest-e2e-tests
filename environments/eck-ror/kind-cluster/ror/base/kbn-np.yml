apiVersion: v1
kind: Service
metadata:
  name: eck-ror-kbn-np
spec:
  type: NodePort
  # The cluster has one Kibana pod. Without this, each readiness failure removes its endpoint,
  # and each open request ends in ECONNRESET instead of a slow response.
  publishNotReadyAddresses: true
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30011
  selector:
    common.k8s.elastic.co/type: kibana
    kibana.k8s.elastic.co/name: eck-ror
