kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# The kubelet rotates a container log at 10Mi by default, and `kubectl logs` reads only the current
# file. Kibana at debug level writes 10Mi in about 8 minutes. 500Mi keeps a whole suite run in one file.
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  containerLogMaxSize: 500Mi
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30010
    hostPort: 9200
  - containerPort: 30011
    hostPort: 5601
  - containerPort: 30012
    hostPort: 8888
  - containerPort: 30013
    hostPort: 8200
  - containerPort: 30014
    hostPort: 3000
- role: worker
- role: worker
