name: 'Docker memory monitor'
description: 'Start or stop a background Docker memory monitor that logs host and container memory every 10s'

inputs:
  action:
    description: '"start" or "stop"'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Start monitor
      if: inputs.action == 'start'
      shell: bash
      run: |
        (
          while true; do
            echo "===== $(date -Is) ====="

            echo "== host memory =="
            free -h || true

            echo
            echo "== docker stats =="
            docker stats --no-stream || true

            echo
            echo "== container OOM status =="
            # RestartCount / StartedAt / Health matter as much as OOMKilled here. A container that
            # bounces between two 10s samples looks identical to one that never moved if you only
            # print Status, and the failure mode we keep hitting is a container that stays "running"
            # and "healthy" while it has stopped serving traffic — the healthcheck runs inside the
            # container against localhost, so a wedged-but-listening process still reports healthy.
            for c in $(docker ps -aq 2>/dev/null); do
              docker inspect "$c" \
                --format 'Name={{.Name}} Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} Health={{if .State.Health}}{{.State.Health.Status}}/{{.State.Health.FailingStreak}}{{else}}none{{end}} Memory={{.HostConfig.Memory}} MemorySwap={{.HostConfig.MemorySwap}}'
            done

            # The recurring failure is a stack that stays Running/Ready/healthy while it serves
            # nothing: specs go from ~20s to 4-16 min, cy.task('httpCall') hits its 20s ceiling and
            # 'Loading Elastic' never appears. Every state field we sample says "fine" throughout,
            # because a wedged-but-listening process still passes an in-container healthcheck and
            # still reports 1/1 Ready. These probes ask the only question that distinguishes the two
            # — can something outside actually get a response, and how fast — and cost ~2 lines per
            # sample. Same URLs work for both environments; the eck env exposes the same ports.
            echo
            echo "== service reachability (http_code / total_time_s) =="
            for svc in "kibana https://localhost:5601/api/status" "es https://localhost:9200/_cluster/health"; do
              name="${svc%% *}"; url="${svc#* }"
              printf '%s ' "$name"
              # `|| true` only: -w still emits its line when curl fails (http_code=000 for a refused
              # connection or a --max-time abort), so an extra fallback echo would just print a
              # second, contradictory-looking line for the same probe.
              curl -sk -o /dev/null -u kibana:kibana \
                   --max-time 10 \
                   -w 'http_code=%{http_code} total_time=%{time_total} connect_time=%{time_connect}\n' \
                   "$url" 2>/dev/null || true
            done

            echo
            echo "== kubectl pod status =="
            kubectl get pods -A 2>/dev/null || true

            echo
            echo "== kubectl node resources =="
            kubectl top nodes 2>/dev/null || true

            echo
            echo "== kubectl pod resources =="
            kubectl top pods -A 2>/dev/null || true

            echo
            echo "== kubectl OOM events =="
            kubectl get events -A --field-selector=reason=OOMKilling 2>/dev/null || true

            # The eck environment wedges the same way the docker one does, and reason=OOMKilling
            # alone never showed anything for it. Warnings cover the restarts, probe failures and
            # evictions that would explain a pod that is Running but not serving.
            #
            # lastTimestamp is printed explicitly and the list is sorted by it. The default output
            # shows only a relative AGE, and because this loop re-dumps the whole event list every
            # 10s, the SAME startup events reappear in every sample and read as ongoing trouble. That
            # is not hypothetical: it made a 35-minute wedge look like Elasticsearch flapping its
            # readiness probe, when the pod was in fact 1/1 Ready with 0 restarts for all 140 samples
            # and the events were 29-34 minutes stale — i.e. from bootstrap. Absolute timestamps make
            # stale-vs-live decidable instead of a judgement call.
            echo
            echo "== kubectl warning events (newest last, absolute timestamps) =="
            kubectl get events -A --field-selector=type=Warning \
              --sort-by=.lastTimestamp \
              -o custom-columns='LAST:.lastTimestamp,COUNT:.count,NS:.metadata.namespace,REASON:.reason,OBJECT:.involvedObject.name,MESSAGE:.message' \
              2>/dev/null | tail -25 || true

            echo
            sleep 10
          done
        ) >> /tmp/docker-memory-monitor.log 2>&1 &
        echo $! > /tmp/docker-memory-monitor.pid

    - name: Stop monitor and dump log
      if: inputs.action == 'stop'
      shell: bash
      run: |
        kill "$(cat /tmp/docker-memory-monitor.pid)" 2>/dev/null || true
        echo "=== Docker memory monitor log ==="
        cat /tmp/docker-memory-monitor.log || true
