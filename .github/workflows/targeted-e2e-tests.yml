name: Targeted E2E Tests

on:
  workflow_dispatch:
    inputs:
      elk_version:
        description: 'ELK version to test (e.g., 9.4.1)'
        required: true
        type: string
      env:
        description: 'Environment type (e.g., docker, eck-3.4.0)'
        required: true
        type: string
      ror_es_version:
        description: 'ReadonlyREST Elasticsearch Version (e.g., 1.69.1)'
        required: false
        type: string
      ror_kbn_version:
        description: 'ReadonlyREST Kibana Version (e.g., 1.69.1)'
        required: false
        type: string
      mode:
        description: 'Repository source for ROR plugin docker image (e.g., prod, dev)'
        required: false
        default: 'prod'
        type: string

env:
  APPLY_RESOURCE_LIMITS: "auto"

jobs:
  e2e-tests:
    name: "🔬 E2E Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'

      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space

      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start

      - name: Run E2E tests
        uses: ./.github/run-e2e-tests
        with:
          env: ${{ github.event.inputs.env }}
          elk: ${{ github.event.inputs.elk_version }}
          mode: ${{ github.event.inputs.mode }}
          ror_es: ${{ github.event.inputs.ror_es_version }}
          ror_kbn: ${{ github.event.inputs.ror_kbn_version }}
          # One attempt: a person is waiting on this run, and a retry only doubles that wait.
          max_attempts: '1'
          activation_key: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
          electron_extra_launch_args: '--disable-gpu'

      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop

      - name: S3 Upload Videos & show logs
        if: failure()
        # The job already failed. If this upload also fails, do not fail the job again.
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ vars.ROR_S3_ENDPOINT_URL }}
          bucket: ${{ vars.ROR_S3_BUCKET }}
          region: ${{ vars.ROR_S3_REGION }}
          path_prefix: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}
