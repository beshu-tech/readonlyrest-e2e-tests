name: Targeted E2E Tests
# A caller that dispatches this workflow finds its run by this title: a dispatch returns no run id.
# readonlyrest_kbn builds the same text in dispatch_e2e_tests, so change both together.
run-name: Targeted E2E ${{ inputs.elk_version }} ${{ inputs.env }} ${{ inputs.ror_kbn_version }}

on:
  workflow_dispatch:
    inputs:
      elk_version:
        description: 'ELK version to test (e.g., 9.4.1)'
        required: true
        type: string
      env:
        description: 'Environment type (e.g., docker, eck-3.4.0)'
        required: true
        type: string
      ror_es_version:
        description: 'ReadonlyREST Elasticsearch Version (e.g., 1.69.1)'
        required: false
        type: string
      ror_kbn_version:
        description: 'ReadonlyREST Kibana Version (e.g., 1.69.1)'
        required: false
        type: string
      mode:
        description: 'Repository source for ROR plugin docker image (e.g., prod, dev)'
        required: false
        default: 'prod'
        type: string
      target_branch:
        description: 'Branch of the caller. The run takes the tests of the branch here that fits it. Empty: the tests of the dispatched ref.'
        required: false
        type: string
      fallback_branch:
        description: 'Branch that the change of the caller is based on. The run uses it when target_branch is not here.'
        required: false
        type: string

env:
  APPLY_RESOURCE_LIMITS: "auto"

jobs:
  e2e-tests:
    name: "🔬 E2E Tests"
    runs-on: ${{ fromJSON(vars.E2E_REPO_RUNS_ON || '["ubuntu-24.04"]') }}
    # The suite step stops at 90 minutes. The other 25 cover the set-up steps and the upload. The
    # default of 360 minutes keeps a hung step on the runner for 6 hours.
    timeout-minutes: 115
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Check out the tests that fit the caller
        if: inputs.target_branch != ''
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          FALLBACK_BRANCH: ${{ inputs.fallback_branch }}
        run: ci/checkout-branch.sh "$TARGET_BRANCH" "$FALLBACK_BRANCH"

      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'

      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space

      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start

      - name: Run E2E tests
        uses: ./.github/run-e2e-tests
        with:
          env: ${{ github.event.inputs.env }}
          elk: ${{ github.event.inputs.elk_version }}
          mode: ${{ github.event.inputs.mode }}
          ror_es: ${{ github.event.inputs.ror_es_version }}
          ror_kbn: ${{ github.event.inputs.ror_kbn_version }}
          activation_key: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}

      - name: Upload the E2E summary
        # A caller that dispatches this workflow downloads the per-spec table from here: GitHub
        # gives no API for the run summary page.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-summary
          path: results/e2e-summary.md
          if-no-files-found: ignore

      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop

      - name: S3 Upload Videos & show logs
        if: failure()
        # The job already failed. If this upload also fails, do not fail the job again.
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ vars.ROR_S3_ENDPOINT_URL }}
          bucket: ${{ vars.ROR_S3_BUCKET }}
          region: ${{ vars.ROR_S3_REGION }}
          path_prefix: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}
          secrets_to_redact: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
