name: End-to-end test workflow

# What each trigger runs. The bootstrap sweep is a separate workflow.
#
#   trigger                      images       environments
#   daily cron, manual dispatch  prod + dev   docker, eck-2.16.1, eck-3.5.0
#   push to master               prod         docker, eck-3.5.0
#   push to develop              dev          docker, eck-3.5.0
#   pull request to master       prod         docker, eck-3.5.0
#   pull request to develop      dev          docker, eck-3.5.0
#   draft pull request           as above     docker
#
# prod images are the released plugins. dev images are built from the branch under test, or from
# develop on the cron.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'
  # Only the two long-lived branches. Feature branches are covered by their pull request, and
  # listing them here would run everything twice for every push to an open PR.
  # paths-ignore on both: a change to prose cannot change what the suite does. Keep the list to
  # files that are never read at runtime.
  push:
    branches: [master, develop]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  # ready_for_review: a draft runs docker only, and the ECK leg must run when the draft ends.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']

# A second push to a pull request cancels the run in progress. Every other run is grouped by its
# run id, so those runs neither cancel nor queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APPLY_RESOURCE_LIMITS: "auto"

jobs:
  # ==========================================
  # MATRIX
  # ==========================================
  # ci/e2e-matrix.sh holds the ELK version list. The environments depend on the trigger, as the
  # table at the top says.
  setup:
    name: "🧮 Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      e2e: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build the matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule|workflow_dispatch) ENVS="docker eck-2.16.1 eck-3.5.0" ;;
            *) [ "$DRAFT" = "true" ] && ENVS="docker" || ENVS="docker eck-3.5.0" ;;
          esac
          {
            echo "versions=$(./ci/e2e-matrix.sh versions)"
            echo "e2e=$(./ci/e2e-matrix.sh matrix $ENVS)"
          } >> "$GITHUB_OUTPUT"

  # ==========================================
  # E2E TESTS - RELEASED (PROD) PLUGIN IMAGES
  # ==========================================
  # Runs against the RELEASED plugin images (`--mode prod`, ror-latest). The signal is "the shipped
  # plugins still pass the suite": master itself, PRs targeting it, and the daily cron.
  prod-e2e-tests:
    name: "🔬 E2E Tests (released plugins)"
    needs: setup
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.e2e) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      - name: Run E2E tests
        uses: ./.github/run-e2e-tests
        with:
          env: ${{ matrix.env }}
          elk: ${{ matrix.version }}
          mode: prod
          activation_key: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
          electron_extra_launch_args: '--disable-gpu'
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      - name: S3 Upload Videos & show logs
        if: failure()
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ vars.ROR_S3_ENDPOINT_URL }}
          bucket: ${{ vars.ROR_S3_BUCKET }}
          region: ${{ vars.ROR_S3_REGION }}
          path_prefix: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}

  # ==========================================
  # DEV IMAGE PREPARATION
  # ==========================================
  # Builds dev images of both plugins for dev-e2e-tests, tagged per run. One dispatch per plugin
  # covers the whole matrix, since both pre-build workflows accept a version list. `target_branch`
  # is passed verbatim; both fall back to `develop` if the branch is not there.
  # Fork PRs are excluded: the dispatch needs secrets GitHub does not expose to them.
  prepare-dev-images:
    name: "🏗️ Prepare dev images"
    needs: setup
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref != 'master' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run_tag: ${{ steps.prepare.outputs.run_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Dispatch and await ROR plugin pre-builds
        id: prepare
        env:
          ELK_VERSIONS_JSON: ${{ needs.setup.outputs.versions }}
          # The cron builds develop. On a PR, head_ref is the source branch: the plugins must be
          # built from the PR head, not from the merge ref github.ref points at. On a push or a
          # manual dispatch, head_ref is empty and ref_name is the branch.
          TARGET_BRANCH: ${{ github.event_name == 'schedule' && 'develop' || github.head_ref || github.ref_name }}
          ROR_GH_TOKEN: ${{ secrets.ROR_GH_TOKEN }}

        run: |
          set -euo pipefail
          . ci/prebuild-images-lib.sh

          # Unique per attempt: a re-run must not silently reuse the previous attempt's images.
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          # The pre-build helpers take a space-separated list; the matrix travels as JSON.
          ELK_VERSIONS=$(jq -r 'join(" ")' <<< "$ELK_VERSIONS_JSON")
          echo "run_tag=$RUN_TAG" >> "$GITHUB_OUTPUT"

          dispatch_prebuild_images "$ELK_VERSIONS" "$TARGET_BRANCH" "$RUN_TAG"
          wait_for_prebuild_images "$ELK_VERSIONS" "$RUN_TAG"

  # ==========================================
  # E2E TESTS - PRE-BUILD (DEV) PLUGIN IMAGES
  # ==========================================
  # Runs against the per-run dev images produced by prepare-dev-images. Skipped automatically when
  # that job is skipped.
  dev-e2e-tests:
    name: "🧪 E2E Tests (pre-build plugins)"
    needs: [setup, prepare-dev-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.e2e) }}
    env:
      ROR_IMAGE_TAG: ${{ needs.prepare-dev-images.outputs.run_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      - name: Run E2E tests
        uses: ./.github/run-e2e-tests
        with:
          env: ${{ matrix.env }}
          elk: ${{ matrix.version }}
          mode: dev
          ror_es: ${{ env.ROR_IMAGE_TAG }}
          ror_kbn: ${{ env.ROR_IMAGE_TAG }}
          activation_key: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}

      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      - name: S3 Upload Videos & show logs
        if: failure()
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ vars.ROR_S3_ENDPOINT_URL }}
          bucket: ${{ vars.ROR_S3_BUCKET }}
          region: ${{ vars.ROR_S3_REGION }}
          path_prefix: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}
