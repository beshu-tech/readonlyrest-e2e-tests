name: End-to-end test workflow

on:
  workflow_dispatch: {}
  schedule:
    # Nightly: the suite against the released images.
    - cron: '0 0 * * *'
    # Sunday: the bootstrap sweep as well. See master-bootstrap-tests for why it is not nightly.
    - cron: '0 1 * * 0'
  # Sent by the ROR plugin release pipelines when they publish new `<elk>-ror-latest` images. Those
  # tags are the only input the bootstrap sweep has, so a release is the moment it is worth running.
  repository_dispatch:
    types: [ror-plugins-released]
  # Only the two long-lived branches. Feature branches are covered by their pull request, and
  # listing them here would run everything twice for every push to an open PR.
  # paths-ignore on both: a change to prose cannot change what the suite does, and a docs-only
  # pull request costs the same 12 legs as a code one without it. Keep the list to files that are
  # never read at runtime — anything under e2e-tests/, .github/ or environments/ must still run.
  push:
    branches: [master, develop]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']

# A second push to the same pull request makes the first run's result worthless, and this suite
# holds runners for hours. Cancel it. Only for pull requests: on master, the nightly and a manual
# dispatch the group is the run id, which is unique, so those runs neither cancel nor queue behind
# each other. Grouping them by ref instead would park a nightly behind a master push for hours.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APPLY_RESOURCE_LIMITS: "auto"

jobs:
  # ==========================================
  # MATRIX
  # ==========================================
  # One source for the ELK version list and the (version, environment) pairs. ci/e2e-matrix.sh
  # explains why the pairs are not a cross product; the short form is that the two ECK operator
  # versions agree with each other and the extra column buys no information. The nightly asks for
  # the flipped pairing, so the pairs a pull request does not run are covered within 24 hours.
  setup:
    name: "🧮 Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      e2e: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build the matrix
        id: matrix
        run: |
          set -euo pipefail
          FLIP=""
          [ "${{ github.event_name }}" = "schedule" ] && FLIP="--flip"
          {
            echo "versions=$(./ci/e2e-matrix.sh versions)"
            echo "e2e=$(./ci/e2e-matrix.sh matrix $FLIP)"
          } >> "$GITHUB_OUTPUT"

  # ==========================================
  # E2E TESTS - RELEASED (PROD) PLUGIN IMAGES
  # ==========================================
  # Runs against the RELEASED plugin images (`--mode prod`, ror-latest). The signal is "the shipped
  # plugins still pass the suite": master itself, PRs targeting it, and the nightly schedule.
  prod-e2e-tests:
    name: "🔬 E2E Tests (released plugins)"
    needs: setup
    # The nightly cron only. The workflow carries a second, weekly cron for the bootstrap sweep,
    # and this job has nothing to add on that run.
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.e2e) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      - name: Run E2E tests
        uses: ./.github/run-e2e-tests
        with:
          env: ${{ matrix.env }}
          elk: ${{ matrix.version }}
          mode: prod
          activation_key: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
          electron_extra_launch_args: '--disable-gpu'
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      - name: S3 Upload Videos & show logs
        if: failure()
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ vars.ROR_S3_ENDPOINT_URL }}
          bucket: ${{ vars.ROR_S3_BUCKET }}
          region: ${{ vars.ROR_S3_REGION }}
          path_prefix: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}

  # ==========================================
  # BOOTSTRAP TESTS
  # ==========================================
  # Boots each released ELK version against the released plugin images and stops. `--run bootstrap`
  # runs no tests: the only assertion is that `docker compose up --wait` returned 0. What it can
  # catch is "a newly published <elk>-ror-latest image does not start on this old version".
  #
  # It runs on a release, weekly, and on a push to master. Not nightly, and not on pull requests:
  #
  #   - Its input is the `<elk>-ror-latest` tags, which move when ROR releases, about twice a
  #     month. Nothing in this repository can change them, so a pull request cannot change the
  #     result, and a nightly asks the same question 30 times between two answers.
  #   - The yield says the same. Over 75 nightly runs, 3317 executed legs produced 7 failures, 6 of
  #     them the 7.10.0 below that is already out of the list.
  #   - It used to gate on prod-e2e-tests, which meant one flaky suite leg skipped all 68. It ran on
  #     14 of the last 30 nightlies. A release dispatch is a better signal than a run that the thing
  #     it does not depend on can cancel.
  #
  # Only docker. Over those 75 nightlies the docker and eck columns failed on exactly the same
  # versions, and this job starts a stack rather than exercising the proxy, which is where docker
  # and ECK actually differ.
  master-bootstrap-tests:
    name: "🚀 Bootstrap Tests"
    if: >
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 0') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.10.0 was temporarily removed due to this issue: https://github.com/sscarduzio/elasticsearch-readonlyrest-plugin/pull/1362. Add it again when the fix is released.
        version: ["9.5.0", "9.4.0", "9.3.0", "9.2.0", "9.1.0", "9.0.0", "8.19.0", "8.18.0", "8.17.0", "8.16.0", "8.15.0", "8.14.0", "8.13.0", "8.12.0", "8.11.0", "8.10.1", "8.9.0", "8.8.0", "8.7.0", "8.6.0", "8.5.0", "8.4.0", "8.3.0", "8.2.0", "8.1.0", "8.0.0", "7.17.0", "7.16.0", "7.15.0", "7.14.0", "7.13.0", "7.12.0", "7.11.2", "7.9.0"]
        env: [docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
        with:
          # A bootstrap leg starts the stack and stops. It pulls two images and never writes a
          # video, a screenshot or a Cypress cache, so it does not need the toolchains deleted.
          required_gb: '8'
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      - name: Run bootstrap tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_on: any
          command: |
            ./runner.sh --run bootstrap --env ${{ matrix.env }} --elk ${{ matrix.version }}
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop

  # ==========================================
  # DEV IMAGE PREPARATION - DEVELOP AND NON-MASTER PRs
  # ==========================================
  # Builds branch-matched dev images of both plugins for dev-e2e-tests, tagged per run. One dispatch
  # per plugin covers the whole matrix, since both pre-build workflows accept a version list.
  # `target_branch` is passed verbatim; both fall back to `develop` if the branch is not there.
  # Fork PRs are excluded: the dispatch needs secrets GitHub does not expose to them.
  prepare-dev-images:
    name: "🏗️ Prepare dev images"
    needs: setup
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref != 'master' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run_tag: ${{ steps.prepare.outputs.run_tag }}
      versions: ${{ steps.prepare.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Dispatch and await ROR plugin pre-builds
        id: prepare
        env:
          # From ci/e2e-matrix.sh through the setup job, the same list prod-e2e-tests runs on.
          ELK_VERSIONS_JSON: ${{ needs.setup.outputs.versions }}
          # On a PR, head_ref is the source branch — the plugins must be built from the PR head, not
          # from the merge ref github.ref points at. On a push, head_ref is empty and ref_name is
          # the branch that was pushed (develop).
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          ROR_GH_TOKEN: ${{ secrets.ROR_GH_TOKEN }}

        run: |
          set -euo pipefail
          . ci/prebuild-images-lib.sh

          # Unique per attempt: a re-run must not silently reuse the previous attempt's images.
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          # The pre-build helpers take a space-separated list; the matrix travels as JSON.
          ELK_VERSIONS=$(jq -r 'join(" ")' <<< "$ELK_VERSIONS_JSON")
          {
            echo "run_tag=$RUN_TAG"
            echo "versions=$ELK_VERSIONS_JSON"
          } >> "$GITHUB_OUTPUT"

          dispatch_prebuild_images "$ELK_VERSIONS" "$TARGET_BRANCH" "$RUN_TAG"
          wait_for_prebuild_images "$ELK_VERSIONS" "$RUN_TAG"

  # ==========================================
  # E2E TESTS - PRE-BUILD (DEV) PLUGIN IMAGES
  # ==========================================
  # Every push to develop and every non-fork pull request that does not target master, against the
  # per-run, branch-matched dev images produced by prepare-dev-images. Skipped automatically when
  # that job is skipped.
  dev-e2e-tests:
    name: "🧪 E2E Tests (pre-build plugins)"
    needs: [setup, prepare-dev-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.e2e) }}
    env:
      ROR_IMAGE_TAG: ${{ needs.prepare-dev-images.outputs.run_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure the Docker Hub mirror
        run: source .github/scripts/docker-hub-mirror.sh
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      - name: Run E2E tests
        uses: ./.github/run-e2e-tests
        with:
          env: ${{ matrix.env }}
          elk: ${{ matrix.version }}
          mode: dev
          ror_es: ${{ env.ROR_IMAGE_TAG }}
          ror_kbn: ${{ env.ROR_IMAGE_TAG }}
          activation_key: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}

      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      - name: S3 Upload Videos & show logs
        if: failure()
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ vars.ROR_S3_ENDPOINT_URL }}
          bucket: ${{ vars.ROR_S3_BUCKET }}
          region: ${{ vars.ROR_S3_REGION }}
          path_prefix: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}
