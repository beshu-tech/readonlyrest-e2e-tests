name: End-to-end test workflow

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, synchronize, reopened]

env:
  APPLY_RESOURCE_LIMITS: "auto"

jobs:
  # ==========================================
  # E2E TESTS - RELEASED (PROD) PLUGIN IMAGES
  # ==========================================
  # Runs against the RELEASED plugin images (`--mode prod`, ror-latest). The signal is "the shipped
  # plugins still pass the suite".
  #
  # Selection is base-driven: this covers master itself and every PR targeting master, so a PR is
  # tested exactly the way its target branch is tested and a green PR cannot turn the nightly red
  # after merge. The corollary is that a spec may only land on master once the plugin change it
  # exercises has been released — specs synced from ROR KBN `develop` belong on `develop` until then,
  # and a PR to master that fails only on such specs is reporting that correctly.
  #
  # Keep the matrix in sync with ELK_VERSIONS in prepare-dev-images.
  prod-e2e-tests:
    name: "🔬 E2E Tests (released plugins)"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["9.4.4", "9.3.8", "8.19.19", "7.17.29"]
        env: [docker, eck-2.16.1, eck-3.4.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      #
      # 35 minutes, not 60: a healthy full suite is 16-33 min (measured across the matrix). The
      # failure mode this guards against is an attempt where the stack comes up fine and then wedges
      # — Kibana stays alive and healthy but stops serving, specs go from ~20s to 4-16 min each, and
      # the attempt runs out the clock. At 60 min that burns an hour before the retry starts and
      # pushes jobs to 85-95 min; at 35 the wedged attempt is cut loose early and the retry (which
      # usually passes) gets a full budget of its own.
      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 2
          timeout_minutes: 35
          retry_wait_seconds: 120
          retry_on: any
          command: |
            ./runner.sh --run e2e --env ${{ matrix.env }} --elk ${{ matrix.version }} --mode prod
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_KBN_LICENSE }}
          ELECTRON_EXTRA_LAUNCH_ARGS: '--disable-gpu'
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      # Never fail the job on the artifact upload: this step only runs when the tests already
      # failed, and a credential problem here would replace that diagnosis with its own.
      - name: S3 Upload Videos & show logs
        if: failure()
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ secrets.AWS_ENDPOINT_URL }}

  # ==========================================
  # BOOTSTRAP TESTS
  # ==========================================
  # Gates on prod-e2e-tests, which covers every trigger in this job's `if` (master itself, and PRs
  # targeting master). Bootstrap uses released images (no --mode), as it did before.
  master-bootstrap-tests:
    name: "🚀 Bootstrap Tests"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      (github.base_ref == 'master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false))
    needs: prod-e2e-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["9.4.0", "9.3.0", "9.2.0", "9.1.0", "9.0.0", "8.19.0", "8.18.0", "8.17.0", "8.16.0", "8.15.0", "8.14.0", "8.13.0", "8.12.0", "8.11.0", "8.10.1", "8.9.0", "8.8.0", "8.7.0", "8.6.0", "8.5.0", "8.4.0", "8.3.0", "8.2.0", "8.1.0", "8.0.0", "7.17.0", "7.16.0", "7.15.0", "7.14.0", "7.13.0", "7.12.0", "7.11.2", "7.10.0", "7.9.0"]
        env: [docker, eck-3.4.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      - name: Run bootstrap tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_on: any
          command: |
            ./runner.sh --run bootstrap --env ${{ matrix.env }} --elk ${{ matrix.version }}
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_KBN_LICENSE }}
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop

  # ==========================================
  # DEV IMAGE PREPARATION - DEVELOP AND NON-MASTER PRs
  # ==========================================
  # Builds branch-matched dev images of BOTH plugins before dev-e2e-tests runs, the same way the ROR
  # ES and ROR KBN repos do it for their own e2e jobs (ci/e2e-tests-lib.sh there). Without this the
  # develop suite ran against the mutable `<version>-ror-latest` dev tag, which is neither
  # branch-matched nor stable for the duration of a run.
  #
  # One job, not one per matrix cell: both pre-build endpoints accept a version LIST, so the whole
  # matrix costs two dispatches, and the image wait is paid once instead of twelve times.
  #
  # `target_branch` is passed verbatim; both pipelines fall back to `develop` when the branch does
  # not exist on their side, so an e2e-only branch name is always safe.
  # PRs targeting master are excluded — those are the prod-e2e-tests path. Everything else that is
  # not master (develop, and PRs targeting develop or any other branch) lands here.
  #
  # Fork PRs are excluded too: the dispatch needs ES_REPO_AZURE_PAT / KBN_REPO_GH_TOKEN, which GitHub
  # does not expose to workflows triggered from a fork. Fork PRs therefore get no e2e coverage —
  # unchanged from before, when they were excluded from the master job for the same reason.
  prepare-dev-images:
    name: "🏗️ Prepare dev images"
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref != 'master' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    # Ceiling for the two polls in ci/prebuild-images-lib.sh (ES 45 min, KBN 30 min), which only run
    # long when the pre-build pipelines actually rebuild; the unchanged-sources path is a cheap retag.
    timeout-minutes: 90
    outputs:
      run_tag: ${{ steps.prepare.outputs.run_tag }}
      versions: ${{ steps.prepare.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Dispatch and await ROR plugin pre-builds
        id: prepare
        env:
          # Single source of truth for the dev-e2e-tests matrix: emitted as JSON for `fromJSON` and
          # passed as a space-separated list to the dispatchers, so the two can never drift.
          # Mirrors the prod-e2e-tests matrix — keep both in sync.
          ELK_VERSIONS: "9.4.4 9.3.8 8.19.19 7.17.29"
          # PR runs must build from the PR head, not the merge ref.
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          # Both pre-builds are GitHub Actions workflows now — the ES side was ported off Azure
          # DevOps, so ES_REPO_AZURE_PAT is no longer used. ES_REPO_GH_TOKEN needs `actions: write`
          # on sscarduzio/elasticsearch-readonlyrest-plugin, same shape as the KBN token.
          ES_REPO_GH_TOKEN: ${{ secrets.ES_REPO_GH_TOKEN }}
          KBN_REPO_GH_TOKEN: ${{ secrets.KBN_REPO_GH_TOKEN }}
        run: |
          set -euo pipefail
          . ci/prebuild-images-lib.sh

          # Unique per attempt: a re-run must not silently reuse the previous attempt's images.
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "run_tag=$RUN_TAG"
            echo "versions=$(printf '%s\n' $ELK_VERSIONS | jq -Rcn '[inputs]')"
          } >> "$GITHUB_OUTPUT"

          dispatch_prebuild_images "$ELK_VERSIONS" "$TARGET_BRANCH" "$RUN_TAG"
          wait_for_prebuild_images "$ELK_VERSIONS" "$RUN_TAG"

  # ==========================================
  # E2E TESTS - PRE-BUILD (DEV) PLUGIN IMAGES
  # ==========================================
  # Every non-fork pull request and every push to develop, against the per-run, branch-matched dev
  # images produced by prepare-dev-images. Skipped automatically when that job is skipped.
  dev-e2e-tests:
    name: "🧪 E2E Tests (pre-build plugins)"
    needs: prepare-dev-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare-dev-images.outputs.versions) }}
        env: [docker, eck-2.16.1, eck-3.4.1]
    env:
      ROR_IMAGE_TAG: ${{ needs.prepare-dev-images.outputs.run_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      # See the prod job above for why the budget is 35 minutes rather than 60.
      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 2
          timeout_minutes: 35
          retry_wait_seconds: 120
          retry_on: any
          command: |
            ./runner.sh --run e2e --env ${{ matrix.env }} --elk ${{ matrix.version }} --ror-es ${{ env.ROR_IMAGE_TAG }} --ror-kbn ${{ env.ROR_IMAGE_TAG }} --mode dev
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_KBN_LICENSE }}

      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      # Credentials go through `with:`, not `env:` — the composite action sets
      # AWS_ACCESS_KEY_ID from `inputs.access_key_id`, so an env-only form is overwritten with the
      # empty default and every upload dies on "Unable to locate credentials".
      # Never fail the job on the artifact upload: this step only runs when the tests already
      # failed, and a credential problem here would replace that diagnosis with its own.
      - name: S3 Upload Videos & show logs
        if: failure()
        continue-on-error: true
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ secrets.AWS_ENDPOINT_URL }}
