name: End-to-end test workflow

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, synchronize, reopened]

env:
  # These runs use docker directly on the GitHub-hosted runner (host docker, not nested), so the
  # compose *.limits.docker-compose.yml overlays apply cleanly and protect the ~16 GB runner from OOM.
  # start.sh leaves resource limits off by default (safe for the ROR KBN Docker-in-Docker flow);
  # opt in here. (eck-env runs don't use docker-compose limits, so this is a no-op for them.)
  APPLY_RESOURCE_LIMITS: "true"

jobs:
  # ==========================================
  # E2E TESTS - MASTER BRANCH
  # ==========================================
  # Runs against the RELEASED plugin images (`--mode prod`, ror-latest). The signal is "the shipped
  # plugins still pass the suite", so a spec may only land on master once the plugin change it
  # exercises has been released — specs synced from ROR KBN `develop` belong on `develop` until then.
  master-e2e-tests:
    name: "🔬 Master E2E Tests"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      (github.base_ref == 'master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["9.4.4", "9.3.8", "8.19.19", "7.17.29"]
        env: [docker, eck-2.16.1, eck-3.4.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 2
          timeout_minutes: 60
          retry_wait_seconds: 120
          retry_on: any
          command: |
            ./runner.sh --run e2e --env ${{ matrix.env }} --elk ${{ matrix.version }} --mode prod
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_KBN_LICENSE }}
          ELECTRON_EXTRA_LAUNCH_ARGS: '--disable-gpu'
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      - name: S3 Upload Videos & show logs
        if: failure()
        uses: ./.github/upload-videos
        with:
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          endpoint_url: ${{ secrets.AWS_ENDPOINT_URL }}

  # ==========================================
  # BOOTSTRAP TESTS
  # ==========================================
  master-bootstrap-tests:
    name: "🚀 Bootstrap Tests"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      (github.base_ref == 'master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false))
    needs: master-e2e-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["9.4.0", "9.3.0", "9.2.0", "9.1.0", "9.0.0", "8.19.0", "8.18.0", "8.17.0", "8.16.0", "8.15.0", "8.14.0", "8.13.0", "8.12.0", "8.11.0", "8.10.1", "8.9.0", "8.8.0", "8.7.0", "8.6.0", "8.5.0", "8.4.0", "8.3.0", "8.2.0", "8.1.0", "8.0.0", "7.17.0", "7.16.0", "7.15.0", "7.14.0", "7.13.0", "7.12.0", "7.11.2", "7.10.0", "7.9.0"]
        env: [docker, eck-3.4.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      - name: Run bootstrap tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_on: any
          command: |
            ./runner.sh --run bootstrap --env ${{ matrix.env }} --elk ${{ matrix.version }}
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_KBN_LICENSE }}
      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop

  # ==========================================
  # DEV IMAGE PREPARATION - DEVELOP BRANCH
  # ==========================================
  # Builds branch-matched dev images of BOTH plugins before the develop suite runs, the same way the
  # ROR ES and ROR KBN repos do it for their own e2e jobs (ci/e2e-tests-lib.sh there). Without this
  # the develop suite ran against the mutable `<version>-ror-latest` dev tag, which is neither
  # branch-matched nor stable for the duration of a run.
  #
  # One job, not one per matrix cell: both pre-build endpoints accept a version LIST, so the whole
  # matrix costs two dispatches, and the image wait is paid once instead of twelve times.
  #
  # `target_branch` is passed verbatim; both pipelines fall back to `develop` when the branch does
  # not exist on their side, so an e2e-only branch name is always safe.
  prepare-dev-images:
    name: "🏗️ Prepare dev images"
    if: >
      github.ref == 'refs/heads/develop' ||
      (github.base_ref == 'develop' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false))
    runs-on: ubuntu-latest
    # Ceiling for the two polls in ci/prebuild-images-lib.sh (ES 45 min, KBN 30 min), which only run
    # long when the pre-build pipelines actually rebuild; the unchanged-sources path is a cheap retag.
    timeout-minutes: 90
    outputs:
      run_tag: ${{ steps.prepare.outputs.run_tag }}
      versions: ${{ steps.prepare.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Dispatch and await ROR plugin pre-builds
        id: prepare
        env:
          # Single source of truth for the develop matrix: emitted as JSON for `fromJSON` below and
          # passed as a space-separated list to the dispatchers, so the two can never drift.
          ELK_VERSIONS: "9.4.4 9.3.8 8.19.19 7.17.29"
          # PR runs must build from the PR head, not the merge ref.
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          ES_REPO_AZURE_PAT: ${{ secrets.ES_REPO_AZURE_PAT }}
          KBN_REPO_GH_TOKEN: ${{ secrets.KBN_REPO_GH_TOKEN }}
        run: |
          set -euo pipefail
          . ci/prebuild-images-lib.sh

          # Unique per attempt: a re-run must not silently reuse the previous attempt's images.
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "run_tag=$RUN_TAG"
            echo "versions=$(printf '%s\n' $ELK_VERSIONS | jq -Rcn '[inputs]')"
          } >> "$GITHUB_OUTPUT"

          dispatch_prebuild_images "$ELK_VERSIONS" "$TARGET_BRANCH" "$RUN_TAG"
          wait_for_prebuild_images "$ELK_VERSIONS" "$RUN_TAG"

  # ==========================================
  # E2E TESTS - DEVELOP BRANCH
  # ==========================================
  # Runs against the per-run dev images produced by prepare-dev-images.
  develop-e2e-tests:
    name: "🧪 Develop E2E Tests"
    needs: prepare-dev-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare-dev-images.outputs.versions) }}
        env: [docker, eck-2.16.1, eck-3.4.1]
    env:
      ROR_IMAGE_TAG: ${{ needs.prepare-dev-images.outputs.run_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Clean up disk space
        uses: ./.github/cleanup-disk-space
      - name: Start Docker memory monitor
        uses: ./.github/docker-memory-monitor
        with:
          action: start
      # Retry mechanism to handle transient infrastructure issues:
      # - npm error 429 Too Many Requests from registry.npmjs.org
      # - Docker image pull failures (e.g., beshultd/kibana-readonlyrest:*-ror-latest not found)
      # These errors are typically temporary and resolve with a simple retry.
      - name: Run E2E tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 2
          timeout_minutes: 60
          retry_wait_seconds: 120
          retry_on: any
          command: |
            ./runner.sh --run e2e --env ${{ matrix.env }} --elk ${{ matrix.version }} --ror-es ${{ env.ROR_IMAGE_TAG }} --ror-kbn ${{ env.ROR_IMAGE_TAG }} --mode dev
        env:
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_KBN_LICENSE }}

      - name: Stop Docker memory monitor
        if: always()
        uses: ./.github/docker-memory-monitor
        with:
          action: stop
      - name: S3 Upload Videos & show logs
        if: failure()
        uses: ./.github/upload-videos
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
