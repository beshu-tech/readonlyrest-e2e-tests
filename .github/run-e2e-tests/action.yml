name: 'Run E2E tests'
description: 'Runs the Cypress e2e suite once, with a time cap. Holds the cap and the runner invocation, so that the three callers cannot drift apart.'

inputs:
  env:
    description: '"docker", or "eck-<version>" such as eck-3.5.0. Nothing else is accepted.'
    required: true
  elk:
    description: 'ELK version under test'
    required: true
  activation_key:
    description: 'ROR Enterprise activation key.'
    required: true
  mode:
    description: '"prod" for the released images, "dev" for the branch-matched ones, empty to take the default.'
    required: false
    default: ''
  ror_es:
    description: 'Goes into the image tag as <elk>-ror-<this>: a ROR version like 1.69.1, or a pre-build run tag. Empty means "latest", the released plugin.'
    required: false
    default: ''
  ror_kbn:
    description: 'Goes into the Kibana image tag as <elk>-ror-<this>: a ROR version like 1.69.1, or a pre-build run tag. Empty means "latest", the released plugin.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Restore the yarn and Cypress caches
      uses: ./.github/cypress-cache
    - name: Install the pinned kind
      if: startsWith(inputs.env, 'eck-')
      shell: bash
      run: |
        ./environments/eck-ror/install-kind.sh "$RUNNER_TEMP/kind-bin"
        echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
    - name: Run E2E tests
      shell: bash
      run: |
        PARAMS=(--run e2e --env "$ENV" --elk "$ELK_VERSION")
        [ -n "$ROR_ES_VERSION" ] && PARAMS+=(--ror-es "$ROR_ES_VERSION")
        [ -n "$ROR_KBN_VERSION" ] && PARAMS+=(--ror-kbn "$ROR_KBN_VERSION")
        [ -n "$MODE" ] && PARAMS+=(--mode "$MODE")
        # The step fails at the cap, so the callers' `if: failure()` upload still runs. A job
        # timeout cancels the job, and that upload does not run.
        STATUS=0
        timeout --kill-after=60 "$E2E_TIME_CAP_SECONDS" ./runner.sh "${PARAMS[@]}" || STATUS=$?
        if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 137 ]; then
          echo "::error title=E2E%3A ELK $ELK_VERSION on $ENV::runner.sh did not end in $E2E_TIME_CAP_SECONDS s, and it was stopped."
        fi
        exit "$STATUS"
      env:
        ROR_ACTIVATION_KEY: ${{ inputs.activation_key }}
        ENV: ${{ inputs.env }}
        ELK_VERSION: ${{ inputs.elk }}
        ROR_ES_VERSION: ${{ inputs.ror_es }}
        ROR_KBN_VERSION: ${{ inputs.ror_kbn }}
        MODE: ${{ inputs.mode }}
        # One cap for the whole run: the stack start, the suite and the log collection. runner.sh
        # stops the suite 5 minutes before it, so that the logs still get collected.
        #
        # The eck envs set the number: Kubernetes networking answers each request more slowly than
        # the docker-compose bridge, and the 27-spec suite needs more than an hour there.
        E2E_TIME_CAP_SECONDS: 4500
    - name: Put the E2E summary on the run summary page
      # The runner writes the file only when the suite ran, on a pass as well as on a failure.
      if: always()
      shell: bash
      run: |
        [ -f results/e2e-summary.md ] && cat results/e2e-summary.md >> "$GITHUB_STEP_SUMMARY" || true
    - name: Annotate the failed specs and the retried tests
      if: always()
      shell: bash
      run: .github/scripts/report-e2e-flakes.sh results "ELK $ELK_VERSION on $ENV"
      env:
        ELK_VERSION: ${{ inputs.elk }}
        ENV: ${{ inputs.env }}
