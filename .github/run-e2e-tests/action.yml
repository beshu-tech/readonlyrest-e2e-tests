name: 'Run E2E tests'
description: 'Runs the Cypress e2e suite through the retry wrapper. Holds the cap, the retry policy and the runner invocation, so that the three callers cannot drift apart.'

inputs:
  env:
    description: '"docker", or "eck-<version>" such as eck-3.5.0. Nothing else is accepted.'
    required: true
  elk:
    description: 'ELK version under test'
    required: true
  activation_key:
    description: 'ROR Enterprise activation key.'
    required: true
  mode:
    description: '"prod" for the released images, "dev" for the branch-matched ones, empty to take the default.'
    required: false
    default: ''
  ror_es:
    description: 'Goes into the image tag as <elk>-ror-<this>: a ROR version like 1.69.1, or a pre-build run tag. Empty means "latest", the released plugin.'
    required: false
    default: ''
  ror_kbn:
    description: 'Goes into the Kibana image tag as <elk>-ror-<this>: a ROR version like 1.69.1, or a pre-build run tag. Empty means "latest", the released plugin.'
    required: false
    default: ''
  max_attempts:
    description: 'How many times to run the suite. 1 for a hand-dispatched run, where a second attempt only doubles the wait.'
    required: false
    default: '2'
  electron_extra_launch_args:
    description: 'Extra Electron flags for the browser Cypress starts.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Restore the yarn and Cypress caches
      uses: ./.github/cypress-cache
    - name: Run E2E tests
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
      with:
        max_attempts: ${{ inputs.max_attempts }}
        # Per attempt, not per job. The retry also waits after the last attempt, so the worst case
        # is max_attempts x 75 minutes, plus one retry_wait_seconds for each attempt.
        #
        # The eck envs set the number: Kubernetes networking answers each request more slowly than
        # the docker-compose bridge, and the 27-spec suite needs more than an hour there. An
        # attempt that hits the cap reports the timeout and hides the failure that came first.
        timeout_minutes: 75
        retry_wait_seconds: 120
        # For transient infrastructure, not for a failing suite. Two things need it: an HTTP 429
        # from the npm registry, and a dev image the registry does not serve yet.
        retry_on: any
        command: |
          PARAMS=(--run e2e --env "$ENV" --elk "$ELK_VERSION")
          [ -n "$ROR_ES_VERSION" ] && PARAMS+=(--ror-es "$ROR_ES_VERSION")
          [ -n "$ROR_KBN_VERSION" ] && PARAMS+=(--ror-kbn "$ROR_KBN_VERSION")
          [ -n "$MODE" ] && PARAMS+=(--mode "$MODE")
          ./runner.sh "${PARAMS[@]}"
      env:
        ROR_ACTIVATION_KEY: ${{ inputs.activation_key }}
        ELECTRON_EXTRA_LAUNCH_ARGS: ${{ inputs.electron_extra_launch_args }}
        ENV: ${{ inputs.env }}
        ELK_VERSION: ${{ inputs.elk }}
        ROR_ES_VERSION: ${{ inputs.ror_es }}
        ROR_KBN_VERSION: ${{ inputs.ror_kbn }}
        MODE: ${{ inputs.mode }}
    # The artifact below is public, and Actions masks a secret only in the job log, not in a file.
    # Kibana gets the activation key, a JWT, so remove it from the logs: the whole key and each of
    # its three parts, in case a log prints only one part.
    - name: Remove the activation key from the stack logs
      id: remove-activation-key
      if: always() && hashFiles('results/stack-logs/**') != ''
      shell: bash
      env:
        ROR_ACTIVATION_KEY: ${{ inputs.activation_key }}
      run: |
        [ -n "$ROR_ACTIVATION_KEY" ] || exit 0
        # Each file to upload, NUL-separated. find fails on a path that does not exist.
        upload_files() { find results/stack-logs results/e2e-summary.md -type f -print0 2>/dev/null || true; }
        upload_files | xargs -0 -r perl -pi -e '
          BEGIN { @s = grep { length($_) >= 16 } ($ENV{ROR_ACTIVATION_KEY}, split(/\./, $ENV{ROR_ACTIVATION_KEY})) }
          for my $p (@s) { s/\Q$p\E/[ACTIVATION KEY REMOVED]/g }' || true
        # perl -i skips a file it cannot rewrite and still exits 0, so check the result. A public
        # artifact without the logs is better than one with the key.
        if ! upload_files | xargs -0 -r perl -ne '
          BEGIN { @s = grep { length($_) >= 16 } ($ENV{ROR_ACTIVATION_KEY}, split(/\./, $ENV{ROR_ACTIVATION_KEY})) }
          for my $p (@s) { exit 1 if index($_, $p) >= 0 }'; then
          echo "The activation key is still in the stack logs. They are not uploaded."
          rm -rf results/stack-logs results/e2e-summary.md
        fi
    - name: Upload the stack logs of the failed attempts
      # The runner writes results/stack-logs only for an attempt that failed, timed out or was
      # cancelled. So this also uploads them for a job that passed on its retry.
      # Only after the key is out of the logs.
      if: always() && steps.remove-activation-key.outcome == 'success' && hashFiles('results/stack-logs/**') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-stack-logs-${{ inputs.mode || 'default' }}-${{ inputs.env }}-${{ inputs.elk }}-run-attempt-${{ github.run_attempt }}
        path: |
          results/stack-logs
          results/e2e-summary.md
        if-no-files-found: ignore
        retention-days: 14
    - name: Put the E2E summary on the run summary page
      # The runner writes the file only when the suite ran, on a pass as well as on a failure.
      if: always()
      shell: bash
      run: |
        [ -f results/e2e-summary.md ] && cat results/e2e-summary.md >> "$GITHUB_STEP_SUMMARY" || true
